[package]
name = "agent-bridge"
description = "Two-way task dispatch and collaboration between agents (Claude Code ⇄ DSH main agent): append-only store, server-enforced task state machine"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

[dev-dependencies]
tempfile = "3"
