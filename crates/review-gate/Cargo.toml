[package]
name = "review-gate"
description = "Independent review gate for auto-iterate (three-party protocol): external-AI review, tree-bound records, strength gate, circuit breaker"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "review-gate"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono = { version = "0.4", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror = "2"

[dev-dependencies]
tempfile = "3"
