[package]
name = "review-gate"
description = "Independent review gate for auto-iterate (three-party protocol): external-AI review, tree-bound records, strength gate, circuit breaker"
version.workspace = true
edition.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "review-gate"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
chrono = { version = "0.4", features = ["serde"] }
clap = { workspace = true, features = ["derive"] }
llm = { version = "0.1.0", path = "../llm" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror = "2"
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "net", "io-util"] }
