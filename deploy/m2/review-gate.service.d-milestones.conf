[Unit]
StartLimitIntervalSec=3600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10
RestartSteps=5
RestartMaxDelaySec=300
ExecStart=
ExecStart=/usr/local/bin/review-gate serve --state /var/lib/reviewgate/state --listen 127.0.0.1:7878 --token-file /etc/review-gate/client.token --relay-dir /var/lib/reviewgate/relay --milestones /etc/review-gate/milestones.json
