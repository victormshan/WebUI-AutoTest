# review-gate drop-in for M2 step 8 (code revision X = b423a57). Replaces the 2026-10-22
# agents.conf drop-in: keeps --agents-file (now a consistency check against --identity-config,
# which is the identity authority), adds --identity-config, --milestones and --drain-file, and the
# U-c=1 restart limits. Install it AND remove agents.conf (RUNBOOK §3): two ExecStart lines from
# two drop-ins would not combine.
[Unit]
StartLimitIntervalSec=3600
StartLimitBurst=5

[Service]
Restart=on-failure
RestartSec=10
RestartSteps=5
RestartMaxDelaySec=300
ExecStart=
ExecStart=/usr/local/bin/review-gate serve --state /var/lib/reviewgate/state --listen 127.0.0.1:7878 --token-file /etc/review-gate/client.token --identity-config /etc/review-gate/identity.json --agents-file /etc/review-gate/agents.json --relay-dir /var/lib/reviewgate/relay --milestones /etc/review-gate/milestones.json --drain-file /etc/review-gate/drain
