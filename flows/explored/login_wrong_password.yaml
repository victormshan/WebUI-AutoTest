name: login_wrong_password
goal: 在用户名框输入 alice,密码框输入错误密码 wrongpass999,点击“登录”按钮,验证页面仍停留在登录页,并在提示区域显示登录失败/用户名或密码错误的提示信息。
start_url: http://127.0.0.1:8765/
steps:
- intent: Fill username and wrong password, then click login.
  tool: fill_form
  args:
    elements:
    - uid: $0
      value: alice
    - uid: $1
      value: wrongpass999
  targets:
  - role: textbox
    name: 用户名
  - role: textbox
    name: 密码
- intent: Fields are filled; now click the login button.
  tool: click
  args:
    uid: $0
  targets:
  - role: button
    name: 登录
assertions:
- element:
    role: heading
    name: 登录
- element:
    role: button
    name: 登录
- element:
    role: textbox
    name: 用户名
- text: 用户名或密码错误
allowed_console_errors:
- '[error] Failed to load resource: the server responded with a status of 404 (File not found)'
allowed_failed_requests:
- GET /favicon.ico [404]
