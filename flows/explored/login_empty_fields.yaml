name: login_empty_fields
goal: 不填写用户名和密码,直接点击“登录”按钮,验证页面仍停留在登录页,并显示必填项或登录失败的错误提示,且未进入登录后的页面。
start_url: http://127.0.0.1:8765/
steps:
- intent: Fields are empty; click the login button directly.
  tool: click
  args:
    uid: $0
  targets:
  - role: button
    name: 登录
assertions:
- text: 用户名或密码错误
- element:
    role: heading
    name: 登录
- element:
    role: textbox
    name: 用户名
- element:
    role: button
    name: 登录
allowed_console_errors:
- '[error] Failed to load resource: the server responded with a status of 404 (File not found)'
allowed_failed_requests:
- GET /favicon.ico [404]
