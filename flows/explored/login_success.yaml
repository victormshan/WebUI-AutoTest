name: login_success
goal: 在登录表单的用户名框输入 alice,密码框输入 secret123,点击“登录”按钮,验证登录成功:页面离开登录表单,显示商品列表或欢迎/用户信息(如包含 alice)。
start_url: http://127.0.0.1:8765/
steps:
- intent: Fill username and password in one go.
  tool: fill_form
  args:
    elements:
    - uid: $0
      value: alice
    - uid: $1
      value: secret123
  targets:
  - role: textbox
    name: 用户名
  - role: textbox
    name: 密码
- intent: Fields are filled. Click the login button.
  tool: click
  args:
    uid: $0
  targets:
  - role: button
    name: 登录
assertions:
- element:
    role: heading
    name: 商品列表
- text: 欢迎，alice
- element:
    role: button
    name: 退出登录
- text: 机械键盘 ¥399
allowed_console_errors:
- '[error] Failed to load resource: the server responded with a status of 404 (File not found)'
allowed_failed_requests:
- GET /favicon.ico [404]
