# Verifies that every commit pushed to main carries a review-gate attestation signed by the gate's key.
# Merge commits fail the check: integrate with fast-forward / rebase only.
name: review-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REVIEW_GATE_PUBKEY: "ITU9Oc3AbiC/Q/LYPwld2b+OC2rxlqHbvCO7IQcGdXw="
  REVIEW_GATE_SINCE: "2ec2c9ec73abe19b88f1d522a283c5e869485bb4"
  VERIFIER_REF: "2ec2c9ec73abe19b88f1d522a283c5e869485bb4"

jobs:
  attestations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: repo
      - name: Fetch attestation notes
        # Missing before the first attested push; unattested commits then fail the Verify step.
        run: |
          git -C repo fetch origin "+refs/notes/review-gate:refs/notes/review-gate" \
            || echo "no refs/notes/review-gate on the remote yet"
      - name: Check out the pinned verifier
        uses: actions/checkout@v4
        with:
          repository: victormshan/WebUI-AutoTest
          ref: ${{ env.VERIFIER_REF }}
          path: verifier
      - uses: dtolnay/rust-toolchain@stable
      - name: Build verifier
        run: cargo build --release --locked -p review-gate --manifest-path verifier/Cargo.toml
      - name: Verify
        # Commits that only touch .github/workflows/ are skipped: they can only be pushed with the
        # `workflow` scope, which the implementer does not have (this file is how a human pins
        # the key). Every other commit, merges included, must carry a valid attestation.
        run: |
          head=${{ github.event.pull_request.head.sha || github.sha }}
          fail=0
          for c in $(git -C repo rev-list --reverse "$REVIEW_GATE_SINCE..$head"); do
            if [ "$(git -C repo rev-list --no-walk --parents "$c" | wc -w)" -eq 2 ] \
              && ! git -C repo diff-tree --no-commit-id --name-only -r "$c" | grep -qv '^\.github/workflows/'; then
              echo "skip $c (workflow-only change)"
              continue
            fi
            verifier/target/release/review-gate verify --repo repo --pubkey "$REVIEW_GATE_PUBKEY" "$c" || fail=1
          done
          exit $fail
