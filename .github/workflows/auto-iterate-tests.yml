name: auto-iterate tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer
        run: sh tools/auto-iterate/test-install.sh
      - name: Codex adapter
        run: tools/auto-iterate/test-codex-agent.sh
      - name: opencode adapter
        run: tools/auto-iterate/test-opencode-agent.sh
      - name: Manifest tool
        run: tools/auto-iterate/test-manifest.sh
      - name: Driver
        run: sh tools/auto-iterate/test-driver.sh
